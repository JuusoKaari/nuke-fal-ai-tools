# Purpose: Run unit tests on push and pull_request. Tag releases run the same suite in release.yml before zip/publish.

name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # 3.9 is the helper floor. ubuntu-24.04 still has CPython 3.9 x64; ubuntu-latest (26.04) does not.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Run tests
        run: python -m unittest discover -s tests
